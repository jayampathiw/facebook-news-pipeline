name: Fetch News Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signal-studio-workspace
        uses: actions/checkout@v4
        with:
          repository: jayampathiw/signal-studio-workspace
          ssh-key: ${{ secrets.SIGNAL_STUDIO_WORKSPACE_DEPLOY_KEY }}
          path: workspace

      - name: Checkout signal-studio (engine packages)
        uses: actions/checkout@v4
        with:
          repository: jayampathiw/signal-studio
          ssh-key: ${{ secrets.SIGNAL_STUDIO_DEPLOY_KEY }}
          path: workspace/engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Un-pnpm-ify engine packages for npm workspaces
        # apps/news lives in signal-studio-workspace (plain npm workspaces),
        # but the engine packages it links against are pnpm-managed there and
        # use pnpm's "workspace:*" protocol for their own internal cross-deps
        # (e.g. packages/ai -> packages/config) — npm can't parse that. This
        # only touches the ephemeral checkout in this runner, never the real
        # repos.
        run: find workspace/engine/packages -name package.json -exec sed -i 's/"workspace:\*"/"*"/g' {} +

      - name: Install dependencies
        working-directory: workspace
        # No package-lock.json is committed (see signal-studio-workspace's
        # package.json history for why — a reproducible npm 11 bug
        # re-validating this workspace's lockfile shape). Fresh install each
        # run instead of `npm ci`.
        run: npm install

      - name: Run pipeline
        working-directory: workspace
        run: npm run news
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY:              ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_KEY:            ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_BASE_URL:       ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL:          ${{ secrets.ANTHROPIC_MODEL }}
          FAL_KEY:                  ${{ secrets.FAL_KEY }}
          FB_PAGE_ID_FR:            ${{ secrets.FB_PAGE_ID_FR }}
          FB_ACCESS_TOKEN_FR:       ${{ secrets.FB_ACCESS_TOKEN_FR }}
          FB_PAGE_ID_IT:            ${{ secrets.FB_PAGE_ID_IT }}
          FB_ACCESS_TOKEN_IT:       ${{ secrets.FB_ACCESS_TOKEN_IT }}
