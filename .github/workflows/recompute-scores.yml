name: Recompute Publish Scores

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signal-studio-workspace
        uses: actions/checkout@v4
        with:
          repository: jayampathiw/signal-studio-workspace
          ssh-key: ${{ secrets.SIGNAL_STUDIO_WORKSPACE_DEPLOY_KEY }}
          path: workspace

      - name: Checkout signal-studio (engine packages)
        uses: actions/checkout@v4
        with:
          repository: jayampathiw/signal-studio
          ref: refactor
          ssh-key: ${{ secrets.SIGNAL_STUDIO_DEPLOY_KEY }}
          path: workspace/engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Un-pnpm-ify engine packages for npm workspaces
        run: find workspace/engine/packages -name package.json -exec sed -i 's/"workspace:\*"/"*"/g' {} +

      - name: Install dependencies
        working-directory: workspace
        run: npm install

      - name: Recompute publish scores
        working-directory: workspace
        run: npm run recompute-scores
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAL_KEY:                  ${{ secrets.FAL_KEY }}
